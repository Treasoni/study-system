apiVersion: agents.study-system/v1
kind: Skill
metadata:
  name: digest
  version: 1.0.0
  description: "Capture reusable learning from a completed study session."
spec:
  entrypoint: SKILL.md
  capabilities:
    - learning.digest
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
